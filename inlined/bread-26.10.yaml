project: bread

path: /bread

environment:
  PROJECT_PATH: /bread
  SHARED_LIBRARIES: $PROJECT_PATH/tests/lib
  PATH: $PATH:$SHARED_LIBRARIES

exclude:
  - .git
  - .github

repack: |
  # macOS tar packs an AppleDouble ._* sidecar next to every file and stores
  # xattrs as pax headers; the sidecars unpack as real files on the remote and
  # GNU tar warns about every xattr header. Repack to remove both.
  if [ "$(uname -s)" = Darwin ]; then
      tmp=$(mktemp -d)
      trap 'rm -rf "$tmp"' EXIT
      tar -xf - -C "$tmp" <&3
      ( cd "$tmp" && COPYFILE_DISABLE=1 tar --no-mac-metadata --no-xattrs -cf - . ) >&4
  else
      cat <&3 >&4
  fi

backends:
  docker:
    type: adhoc
    allocate: |
      set -e

      ver=$(echo "$SPREAD_SYSTEM" | cut -d- -f2)   # e.g., ubuntu-24.04-amd64 -> 24.04
      arch=$(echo "$SPREAD_SYSTEM" | cut -d- -f3)  # e.g., ubuntu-24.04-amd64 -> amd64
      echo "ver: $ver"
      echo "arch: $arch"
      case "$arch" in
          armhf) platform=linux/arm/v7 ;;  # docker's name for it
          *)     platform="linux/$arch" ;;
      esac

      image="ghcr.io/lczyk/spread-bread/bread:$ver"
      echo "image: $image"

      # Networking mode: how spread reaches the container's sshd.
      #   bridge  -- connect to the container's docker bridge IP. Works where the host
      #              shares the docker bridge network (linux native), so 172.17.x.x is
      #              routable from the spread host.
      #   publish -- publish sshd to 127.0.0.1:<ephemeral host port> and connect there.
      #              Needed where the bridge IP is not host-routable, e.g. Docker
      #              Desktop on macOS (docker runs in a VM).
      # Default is per-OS; override with BREAD_NET=bridge|publish.
      mode="${BREAD_NET:-}"
      if [ -z "$mode" ]; then
          case "$(uname -s)" in
              Darwin) mode=publish ;;
              *)      mode=bridge ;;
          esac
      fi
      case "$mode" in
          bridge|publish) ;;
          *) echo "BREAD_NET must be 'bridge' or 'publish', got: '$mode'" >&2; exit 1 ;;
      esac
      echo "net mode: $mode"

      if [ "$mode" = bridge ]; then
          # Use a counter file to ensure unique container names.
          # snippet thanks to @lengau
          # https://github.com/canonical/charmcraft/blob/120a00a50f7ed3d0ae2fc2bea69e2e43b68b1594/spread.yaml#L72-L79
          sleep 0.$RANDOM  # Minimize chances of a race condition
          # Kept out of the project tree: whatever lives there is packed up and
          # shipped to every container.
          export counter_file="${TMPDIR:-/tmp}/spread-bread-worker-num"
          instance_num=$(
              flock -x $counter_file bash -c '
              [ -s $counter_file ] || echo 0 > $counter_file
              num=$(< $counter_file) && echo $num
              echo $(( $num + 1 )) > $counter_file'
          )
          container_name="bread-${ver}-${arch}-${instance_num}"
          publish_flag=""
      else
          # publish mode: no shared counter file (no flock dependency); a pid+RANDOM
          # suffix is unique enough for a name. Docker picks the free host port.
          container_name="bread-${ver}-${arch}-$$-${RANDOM}"
          publish_flag="-p 127.0.0.1::22"
      fi
      echo "container_name: $container_name"

      docker run \
          --rm \
          --platform "$platform" \
          -e DEBIAN_FRONTEND=noninteractive \
          -e "usr=$SPREAD_SYSTEM_USERNAME" \
          -e "pass=$SPREAD_SYSTEM_PASSWORD" \
          $publish_flag \
          --label spread-bread \
          --name "$container_name" \
          -d "$image"

      # sshd is up within a second or two. The bound and the liveness check are
      # backstops: a container that dies on start would otherwise spin here until
      # spread's own timeout, which reports nothing about the container.
      sshd_up=""
      for ((i = 0; i < 60; i++)); do
          if docker exec "$container_name" pgrep -x sshd >/dev/null 2>&1; then
              sshd_up=1
              break
          fi
          if ! docker inspect "$container_name" --format '{{.State.Status}}' 2>/dev/null | grep -qx running; then
              echo "$container_name is not running; reproduce with: docker run --rm --platform $platform $image" >&2
              docker logs "$container_name" >&2 2>&1 || true
              exit 1
          fi
          sleep 1
      done
      if [ -z "$sshd_up" ]; then
          echo "sshd did not come up in $container_name after 60s" >&2
          docker logs "$container_name" >&2 2>&1 || true
          exit 1
      fi

      # A container whose gnu tar cannot extract falls back to bsdtar (see
      # images/files/tar-shim.sh); say so rather than swapping the tool silently.
      tar_backend=$(docker exec "$container_name" /usr/local/bin/bread-tar-shim --bread-probe 2>/dev/null || echo unknown)
      if [ "$tar_backend" = bsdtar ]; then
          echo "note: gnu tar cannot extract in $container_name (host emulation); using bsdtar"
      fi

      if [ "$mode" = publish ]; then
          host=127.0.0.1
          # The ephemeral host port docker mapped to the container's sshd.
          port=$(docker port "$container_name" 22 | head -n1 | cut -d: -f2)
          [ -n "$port" ] || { echo "could not find published sshd port for $container_name" >&2; exit 1; }
          address="$host:$port"
      else
          host=$(docker inspect "$container_name" --format '{{.NetworkSettings.Networks.bridge.IPAddress}}')
          port=22
          address="$host"
      fi

      # A running sshd can still fail every handshake (openssh's seccomp sandbox
      # under emulation does; see images/files/seccomp-shim.c). Say so here, with the
      # container's logs, rather than leave spread to report a bare EOF.
      if command -v ssh-keyscan >/dev/null 2>&1; then
          handshake=""
          for ((i = 0; i < 10; i++)); do
              if ssh-keyscan -T 5 -t ed25519 -p "$port" "$host" 2>/dev/null | grep -q .; then
                  handshake=1
                  break
              fi
              sleep 1
          done
          if [ -z "$handshake" ]; then
              docker logs "$container_name" >&2 2>&1 || true
              # --rm only fires once the container stops, and a plain exit 1 has
              # spread retry the allocation for 5 minutes; FATAL does not.
              docker rm -f "$container_name" >/dev/null 2>&1 || true
              FATAL "sshd in $container_name is running but no ssh handshake completes"
          fi
      fi

      ADDRESS "$address"
    discard: |
      #!/bin/bash

      set -e

      echo "Discarding container for system: $SPREAD_SYSTEM_ADDRESS"

      # The address format tells us how the container was allocated (see the allocate
      # script's BREAD_NET modes): "host:port" -> publish mode, bare IP -> bridge mode.
      # Inferring from the address makes discard robust even if BREAD_NET is flipped
      # between allocate and discard.
      container_name=""
      case "$SPREAD_SYSTEM_ADDRESS" in
          *:*)
              # publish mode: match the container by its published host port, as it
              # shows up in the ports column, e.g. "127.0.0.1:32768->22/tcp".
              target_port="${SPREAD_SYSTEM_ADDRESS##*:}"
              container_name=$(docker ps -a --filter label=spread-bread --format '{{.Names}} {{.Ports}}' |
                  awk -v m=":${target_port}->22/" 'index($0, m) { print $1; exit }')
              not_found="No container found with published port: $target_port"
              ;;
          *)
              # bridge mode: match the container by its bridge IP address.
              ids=$(docker ps -a --filter label=spread-bread --filter network=bridge --format '{{.ID}}')
              if [ -n "$ids" ]; then
                  container_name=$(docker inspect $ids --format '{{.Name}} {{.NetworkSettings.Networks.bridge.IPAddress}}' |
                      awk -v ip="$SPREAD_SYSTEM_ADDRESS" '$2 == ip { print substr($1, 2); exit }')
              fi
              not_found="No container found with IP address: $SPREAD_SYSTEM_ADDRESS"
              ;;
      esac

      if [ -n "$container_name" ]; then
          echo "Removing container: $container_name"
          docker rm -f "$container_name" 2>/dev/null || true
      else
          echo "$not_found"
          exit 1
      fi
    systems:
      - ubuntu-26.10-amd64:
          password: bread
          workers: 2
      - ubuntu-26.10-arm64:
          password: bread
          workers: 2
      - ubuntu-26.10-s390x:
          password: bread
          workers: 2
      - ubuntu-26.10-ppc64le:
          password: bread
          workers: 2
      - ubuntu-26.10-riscv64:
          password: bread
          workers: 2
      - ubuntu-26.10-armhf:
          password: bread
          workers: 2

  # Opt-in (`spread lxd:`): the same image as an LXD container, local or remote.
  lxd:
    type: adhoc
    manual: true
    allocate: |
      set -e

      flavour=bread
      ver=$(echo "$SPREAD_SYSTEM" | cut -d- -f2)   # e.g., ubuntu-24.04 -> 24.04

      # spread runs this with a fixed PATH, which leaves out homebrew on Apple Silicon.
      PATH="$PATH:/opt/homebrew/bin"

      # A plain exit 1 has spread retry the allocation for 5 minutes; FATAL does not.
      command -v lxc >/dev/null 2>&1 || FATAL "lxc not found; the lxd backend needs the LXD client on this host"

      # LXD runs containers of its own arch only, so the system name has none. The
      # server need not be this machine: lxc may point at a remote.
      kernel_arch=$(lxc info | awk '$1 == "kernel_architecture:" { print $2 }')
      case "$kernel_arch" in
          x86_64)  arch=amd64 ;;
          aarch64) arch=arm64 ;;
          "") FATAL "cannot query LXD; is it initialised (lxd init), or its remote reachable?" ;;
          *) FATAL "no $flavour LXD image for $kernel_arch" ;;
      esac
      name="$flavour-$ver-$arch"
      echo "image: $name"

      # spread reaches sshd through a port LXD forwards on its own machine, since a
      # remote's bridge is not routable from here. A local LXD forwards on loopback.
      remote=$(lxc remote get-default)
      server=$(lxc remote list --format csv |
          awk -F, -v r="$remote" '$1 == r || $1 == r " (current)" { print $2; exit }')
      case "$server" in
          https://*)
              server=${server#https://}
              server=${server%%/*}
              server=${server%:*}
              listen=0.0.0.0
              case "$server" in
                  "["*) FATAL "LXD remote $remote is at an IPv6 address; add it by name or IPv4 address" ;;
              esac
              ;;
          *)
              server=127.0.0.1
              listen=127.0.0.1
              ;;
      esac

      # The images are release assets: a split LXD image (see hack/pack_lxd.sh) and
      # its fingerprint. BREAD_LXD_URL serves them from elsewhere, e.g. a local
      # directory of hack/pack_lxd.sh output over http.
      base="${BREAD_LXD_URL:-https://github.com/lczyk/spread-bread/releases/latest/download}/$name"
      fingerprint=$(curl -fsSL --retry 3 "$base.lxd-fingerprint") ||
          FATAL "cannot fetch $base.lxd-fingerprint"
      [ -n "$fingerprint" ] || FATAL "no fingerprint at $base.lxd-fingerprint"

      instance="$flavour-${ver//./}-$$-$RANDOM"
      echo "instance: $instance"

      fail() {
          echo "$1" >&2
          lxc console "$instance" --show-log >&2 2>&1 || true
          lxc delete --force "$instance" >/dev/null 2>&1 || true
          FATAL "$1"
      }

      # Workers allocate in parallel: one imports, the rest wait for it.
      lock="${TMPDIR:-/tmp}/spread-bread-lxd-$name.lock"
      import_image() (
          # macOS has none. Workers then race, and the import lets the loser through.
          if command -v flock >/dev/null 2>&1; then
              flock -x 9
          fi
          lxc image info "$fingerprint" >/dev/null 2>&1 && exit 0
          # A snap-confined lxc reads files only from a few places, its own
          # per-user dir among them.
          dl_root="$HOME/snap/lxd/common"
          [ -d "$dl_root" ] || dl_root="${TMPDIR:-/tmp}"
          dl=$(mktemp -d "$dl_root/spread-bread-lxd.XXXXXX")
          trap 'rm -rf "$dl"' EXIT
          echo "downloading $name ($fingerprint)"
          curl -fsSL --retry 3 -o "$dl/meta.tar.gz" "$base.lxd-meta.tar.gz" ||
              FATAL "cannot fetch $base.lxd-meta.tar.gz"
          curl -fsSL --retry 3 -o "$dl/rootfs.tar.zst" "$base.lxd-rootfs.tar.zst" ||
              FATAL "cannot fetch $base.lxd-rootfs.tar.zst"
          lxc image import "$dl/meta.tar.gz" "$dl/rootfs.tar.zst" >/dev/null ||
              lxc image info "$fingerprint" >/dev/null 2>&1 ||
              FATAL "cannot import $name into LXD"
          # Drop the copies of this image older releases left behind.
          lxc image list --format csv -c fd | while IFS=, read -r short desc; do
              if [ "$desc" = "spread-bread $flavour $ver $arch" ] && [ "${fingerprint#"$short"}" = "$fingerprint" ]; then
                  lxc image delete "$short" || true
              fi
          done
          lxc image info "$fingerprint" >/dev/null 2>&1 ||
              FATAL "$base.lxd-* changed while downloading; try again"
      ) 9>"$lock"

      # Launches run outside the lock, so they don't queue up behind each other. A
      # run on another release can then drop the image before the launch gets to
      # it; import it again.
      launched=""
      for ((i = 0; i < 3; i++)); do
          import_image
          if lxc launch --ephemeral "$fingerprint" "$instance" -c user.spread-bread=true >/dev/null; then
              launched=1
              break
          fi
          lxc image info "$fingerprint" >/dev/null 2>&1 && break
      done
      [ -n "$launched" ] || fail "cannot launch $instance; is LXD initialised (lxd init)?"

      # peel brings eth0 up over DHCP and starts sshd within a second or two.
      ip=""
      for ((i = 0; i < 120; i++)); do
          ip=$(lxc list --format csv -c n4 user.spread-bread=true |
              awk -F, -v n="$instance" '$1 == n { split($2, a, " "); print a[1]; exit }')
          [ -n "$ip" ] && break
          [ "$(lxc list --format csv -c ns user.spread-bread=true | awk -F, -v n="$instance" '$1 == n { print $2 }')" = RUNNING ] ||
              fail "$instance is not running"
          sleep 0.5
      done
      [ -n "$ip" ] || fail "$instance got no IPv4 address in 60s"

      # LXD takes no "any free port", so guess one and try again when it is taken.
      # $$ keeps parallel workers apart: the bash of macOS often seeds them alike.
      port=""
      for ((i = 0; i < 10; i++)); do
          port=$((20000 + (RANDOM + $$) % 10000))
          if err=$(lxc config device add "$instance" ssh proxy \
              "listen=tcp:$listen:$port" connect=tcp:127.0.0.1:22 2>&1); then
              break
          fi
          port=""
      done
      [ -n "$port" ] || fail "cannot forward a port on $server to $instance: $err"
      addr="$server:$port"

      # discard finds the instance by this key.
      lxc config set "$instance" user.spread-bread-address "$addr" ||
          fail "cannot record the address of $instance"

      if command -v ssh-keyscan >/dev/null 2>&1; then
          handshake=""
          for ((i = 0; i < 30; i++)); do
              if ssh-keyscan -T 2 -t ed25519 -p "$port" "$server" 2>/dev/null | grep -q .; then
                  handshake=1
                  break
              fi
              sleep 0.5
          done
          [ -n "$handshake" ] || fail "sshd in $instance is running but no ssh handshake completes"
      fi

      ADDRESS "$addr"
    discard: |
      #!/bin/bash

      set -e

      echo "Discarding instance for system: $SPREAD_SYSTEM_ADDRESS"

      # spread runs this with a fixed PATH, which leaves out homebrew on Apple Silicon.
      PATH="$PATH:/opt/homebrew/bin"

      # allocate records each instance's address in user.spread-bread-address.
      instance=$(lxc list --format csv -c n,user.spread-bread-address user.spread-bread=true |
          awk -F, -v ip="$SPREAD_SYSTEM_ADDRESS" '$2 == ip { print $1; exit }')

      if [ -n "$instance" ]; then
          echo "Removing instance: $instance"
          lxc delete --force "$instance"
      else
          echo "No instance found with address: $SPREAD_SYSTEM_ADDRESS"
          exit 1
      fi
    systems:
      - ubuntu-26.10:
          password: bread
          workers: 2

suites:
  tests/:
    summary: Replace with your own suites
