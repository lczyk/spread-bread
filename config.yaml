# Pins and the build matrix. Read by hack/build_config.rb, and by the makefile
# through a generated include (.stamp/config.mk). A release input: changing
# anything here cuts a new release.

# Cross-compiled go binaries baked into bread-chisel-releases + bread-test,
# pinned for reproducibility. Named as the make / env vars that carry them.
pins:
  CHISEL_REF: v1.5.1
  SPREAD_REF: "2026.07.12"
  GO_BUILDER_IMAGE: ubuntu/go:1.25-26.04_edge
  # Docker CLI built from docker/cli source at tag v<this>; ubuntu apt's
  # docker.io is built with go 1.24 and crashes under qemu emulation, and
  # docker.com's static tarballs don't cover s390x / ppc64le.
  DOCKER_VERSION: 29.8.0

# Quoted: unquoted, yaml reads 25.10 as the float 25.1.
versions:
  - "22.04"
  - "24.04"
  - "25.10"
  - "26.04"
  - "26.10"
  #

arches:
  - amd64
  - arm64
  - s390x
  - ppc64le
  #

# Arches with native runners (local dev + ci). s390x / ppc64le images build
# under qemu and publish untested; tests + demo stay on the native pair.
native_arches:
  - amd64
  - arm64
  #

# Images published to ghcr (bread-test is test infra only).
flavours:
  - bread
  - bread-chisel-releases
  #
