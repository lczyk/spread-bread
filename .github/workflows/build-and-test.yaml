name: Build and Test

# Reusable. Per-arch native runner builds all bread / bread-chisel-releases /
# bread-test images for its arch (no qemu, no cross-arch matrix entry per
# runner) and then runs spread-in-spread tests scoped to the same arch, and
# the same contract on LXD (tests/run_lxd.sh).

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      APT_MIRROR: http://azure.archive.ubuntu.com/ubuntu/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Restore cached binaries + stamp
        uses: actions/download-artifact@v8.0.2
        with:
          name: binaries-${{ matrix.arch }}
          path: .

      - name: Build images for ${{ matrix.arch }}
        run: make build-bread build-bread-chisel-releases build-bread-test ARCH=${{ matrix.arch }}

      - name: Install spread (host-side, from cached cross-compiled binary)
        run: |
          sudo install -m 0755 \
            "cache/binaries/spread-${{ matrix.arch }}" \
            /usr/local/bin/spread

      - name: Run spread-in-spread tests (${{ matrix.arch }} outer only)
        working-directory: tests
        run: spread "outer:ubuntu-26.04-${{ matrix.arch }}"

      # chisel-releases runs its LXD backend on 5.21; match it.
      - name: Set up LXD
        uses: canonical/setup-lxd@v0.1.3
        with:
          channel: 5.21/stable

      - name: Run LXD contract tests (${{ matrix.arch }})
        run: make test-lxd
