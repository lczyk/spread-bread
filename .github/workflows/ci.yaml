name: CI
run-name: CI for ${{ github.ref }}

# Build + test on PR and on push to main. No publishing.

on:
  pull_request:
  push:
    branches:
      - main
    # Revision bumps go through release.yaml, which builds + tests them.
    paths-ignore:
      - REVISION
  workflow_dispatch:

# Cancel in-flight runs on the same ref when a newer one starts.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A PR merged on GitHub (committer web-flow) is followed by a release, which
  # builds + tests the same tree, so skip the duplicate build on that push.
  build:
    if: github.event.head_commit.committer.username != 'web-flow'
    uses: ./.github/workflows/build.yaml
    with:
      native-images: false

  # Guard: inlined/*.yaml is generated from templates/ + scripts/ and also
  # committed (repo-tree consumers grab it directly). Regenerate and fail on
  # drift so a template or script edit can't land without its matching
  # inlined refresh. Ubuntu runners ship ruby, so no extra setup.
  check-inlined:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert committed inlined yamls match templates + scripts
        run: |
          make inline
          if ! git diff --exit-code inlined/; then
            echo "::error::inlined/*.yaml is stale -- run 'make inline' and commit the result"
            exit 1
          fi

  # REVISION is bumped by bump-revision.yaml after merge, never by a PR.
  # Direct pushes to main don't get that bump, so they must bump REVISION
  # themselves whenever they change release inputs.
  check-revision:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Assert the PR leaves REVISION alone
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_FILES: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files
        run: |
          if gh api --paginate "$PR_FILES" --jq '.[].filename' | grep -qx REVISION; then
            echo "::error::PRs must not edit REVISION -- it is bumped after merge"
            exit 1
          fi

      - name: Checkout repository
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A push that bumps REVISION is released as a whole.
      - name: Assert a direct push leaves no release input unreleased
        if: github.event_name == 'push' && github.event.head_commit.committer.username != 'web-flow'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          git diff --quiet "$BEFORE" HEAD -- REVISION || exit 0
          if hack/bump_revision.rb --pending; then
            echo "::error::release inputs changed since the last release without a REVISION bump -- run hack/bump_revision.rb"
            exit 1
          fi

  # The one check the main ruleset requires, so it doesn't have to list every
  # matrix job by name. always() makes a failed or cancelled dependency fail
  # this job; a skipped required check would count as passing. The only skip
  # is build on a PR-merge push, so skipped dependencies pass.
  ci-ok:
    if: always()
    needs: [build, check-inlined, check-revision]
    runs-on: ubuntu-24.04
    steps:
      - name: Assert every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != success ] && [ "$r" != skipped ]; then
              echo "::error::a job ended as $r"
              exit 1
            fi
          done
