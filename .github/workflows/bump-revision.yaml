name: Bump revision

# After a PR merges into main, commit "release: r<N+1>" (hack/bump_revision.rb)
# and push it so release.yaml fires -- but only if something that ends up in
# a release changed (hack/hash_inputs.rb release), so REVISION moves exactly
# when the artefacts do. A merge done on GitHub is committed by web-flow;
# local pushes (and the bot's own bumps) are not, so they don't bump. Pushes
# as the bot (BOT_PAT) because GITHUB_TOKEN pushes don't trigger workflows;
# the bot needs a main ruleset bypass (required ci-ok check, signed commits).

on:
  push:
    branches: [main]
    paths-ignore: [REVISION]

concurrency:
  group: bump-revision
  cancel-in-progress: false

permissions: {}

jobs:
  bump:
    if: github.event.head_commit.committer.username == 'web-flow'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.BOT_PAT }}

      - name: Bump REVISION and push
        env:
          MERGED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A bump that landed after this merge already releases it.
          if ! git diff --quiet "$MERGED_SHA" HEAD -- REVISION; then
            echo "REVISION moved since $MERGED_SHA; nothing to do"
            exit 0
          fi
          if ! hack/bump_revision.rb --pending "$MERGED_SHA"; then
            echo "no release inputs changed since the last release; nothing to do"
            exit 0
          fi

          git config user.name  "lczyk-bot"
          git config user.email "lczyk-bot@users.noreply.github.com"
          hack/bump_revision.rb
          # Fails rather than double-bumping if main moved since checkout.
          git push origin HEAD:main
