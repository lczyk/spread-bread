name: Build OCI image tarballs

# Reusable. Per-arch runner builds bread + bread-chisel-releases images and
# saves each as a docker-archive tarball (hack/build_images.rb). Tarballs
# upload as images-<arch>, and their config digests alone as
# image-digests-<arch>, so the publish step can tell what changed before
# downloading any tarball.
#
# amd64 / arm64 build on native runners. armhf builds on the arm64 runner,
# whose cpu runs armv7 userland natively. The rest have no hosted runners
# and build under qemu on amd64 (slow). Neither kind gets the test suite;
# they are published after only a login check.
#
# bread-test is intentionally not built here (test-infra-only).

on:
  workflow_call:
    inputs:
      # JSON matrix-include list of {runner, arch, qemu?, login?}; build.yaml
      # owns it.
      matrix:
        type: string
        required: true

permissions:
  contents: read
  actions: read  # look up + download images built by another run

jobs:
  build-images:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    # NOTE: 90 min covers the qemu lanes; native lanes finish well under 30.
    timeout-minutes: 90
    env:
      APT_MIRROR: http://azure.archive.ubuntu.com/ubuntu/

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore cached binaries + stamp
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries-${{ matrix.arch }}
          path: .

      - name: Hash image inputs
        id: inputs
        run: echo "hash=$(hack/hash_inputs.rb images-${{ matrix.arch }})" >> "$GITHUB_OUTPUT"

      # Hit -> skip the build entirely; matters most for the slow qemu lanes.
      # Miss -> build and the cache auto-saves at job end.
      - name: Restore image tarball cache
        id: images-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: images-out/
          key: images-${{ matrix.arch }}-${{ steps.inputs.outputs.hash }}

      # A cache saved by a PR is out of reach of main, so the release after a
      # merge would rebuild what the PR's ci just built. Every build leaves a
      # prebuilt-<arch>-<hash> marker artefact next to its tarballs; find one
      # for these inputs and take that run's tarballs instead. Only runs of
      # this repo count: a fork's PR can upload anything under any name.
      - name: Fetch ${{ matrix.arch }} images built by another run
        id: images-reuse
        if: steps.images-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MARKER: prebuilt-${{ matrix.arch }}-${{ steps.inputs.outputs.hash }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$MARKER&per_page=100" --jq \
            "[.artifacts[] | select(.expired | not) | select(.workflow_run.head_repository_id == $REPO_ID)][0].workflow_run.id // empty") || run_id=""
          if [ -z "$run_id" ]; then
            echo "no run has built $MARKER"
            exit 0
          fi
          echo "taking images-${{ matrix.arch }} from run $run_id"
          if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "images-${{ matrix.arch }}" --dir images-out; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            rm -rf images-out
          fi

      # Needed without a build too: the login check below runs the images.
      - name: Set up qemu (emulated arches only)
        if: matrix.qemu
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Build + save ${{ matrix.arch }} images
        if: steps.images-cache.outputs.cache-hit != 'true' && steps.images-reuse.outputs.hit != 'true'
        run: hack/build_images.rb ${{ matrix.arch }} images-out

      # Without a build the daemon has nothing to run yet.
      - name: Load prebuilt ${{ matrix.arch }} images
        if: matrix.login && (steps.images-cache.outputs.cache-hit == 'true' || steps.images-reuse.outputs.hit == 'true')
        run: for f in images-out/*.tar; do docker load -i "$f"; done

      # These images get no test suite, so at least log into each one the
      # way spread does. A running sshd is not enough; see images/files/seccomp-shim.c.
      - name: Log into every ${{ matrix.arch }} image
        if: matrix.login
        run: |
          set -e
          fail() {
            echo "::error::$1"
            docker logs "$cid" 2>&1 || true
            exit 1
          }
          command -v sshpass >/dev/null || sudo apt-get install -y sshpass
          platform=$(hack/build_config.rb --platform ${{ matrix.arch }})
          for flavour in bread bread-chisel-releases; do
            for ver in 22.04 24.04 25.10 26.04 26.10; do
              tag="$flavour:$ver-${{ matrix.arch }}"
              echo "==> logging into $tag"
              cid=$(docker run -d --platform "$platform" -p 127.0.0.1::22 "$tag")
              port=$(docker port "$cid" 22 | head -n1 | cut -d: -f2)
              [ -n "$port" ] || fail "$tag has no published sshd port"
              ok=""
              for _ in $(seq 30); do
                if sshpass -p bread ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                    -o LogLevel=ERROR -o ConnectTimeout=10 -p "$port" root@127.0.0.1 true; then
                  ok=1
                  break
                fi
                sleep 1
              done
              [ -n "$ok" ] || fail "cannot log into $tag"
              docker rm -f "$cid" >/dev/null
            done
          done

      - name: Upload ${{ matrix.arch }} image tarballs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images-${{ matrix.arch }}
          path: images-out/

      - name: Upload ${{ matrix.arch }} image digests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digests-${{ matrix.arch }}
          path: images-out/digests.json

      # Last, so a marker always has its tarballs. See the fetch step above.
      - name: Upload ${{ matrix.arch }} prebuilt marker
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prebuilt-${{ matrix.arch }}-${{ steps.inputs.outputs.hash }}
          path: images-out/digests.json
