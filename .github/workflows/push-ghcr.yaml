name: Push to GHCR

# Reusable. Publishes the multiarch images from build-oci.yaml's artefacts
# to ghcr.io/<repo>/{bread,bread-chisel-releases}:<ver> via
# hack/publish_images.rb: tags whose images ghcr already has are skipped,
# so the tarballs are only downloaded when something needs pushing.
#
# Expects image-digests-<arch> and images-<arch> artefacts from the same
# workflow run.

on:
  workflow_call:

env:
  REPO: ghcr.io/${{ github.repository }}

jobs:
  stitch-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Each artefact lands in its own <name>/ dir.
      - name: Download per-arch image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-digests-*
          path: artefacts

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
              buildah login --username "${{ github.actor }}" \
                  --password-stdin "${REPO%%/*}"

      - name: Plan which tags to push
        id: plan
        run: hack/publish_images.rb plan artefacts "$REPO" plan.json

      - name: Download per-arch image tarballs
        if: steps.plan.outputs.push == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: images-*
          path: artefacts

      - name: Stitch multiarch manifests + push
        if: steps.plan.outputs.push == 'true'
        run: hack/publish_images.rb push artefacts "$REPO" plan.json

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Cosign login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
              cosign login --username "${{ github.actor }}" \
                  --password-stdin "${REPO%%/*}"

      - name: Sign pushed manifests, re-sign skipped ones that don't verify
        run: hack/publish_images.rb sign "$REPO" plan.json
